<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Zero Trust</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; }
        input, button { margin: 5px 0; width: 100%; padding: 8px; }
        .result { background: #f4f4f4; padding: 10px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Prueba Zero Trust</h1>

    <h2>Generar Token de Usuario</h2>
    <button onclick="generarTokenUsuario()">Generar Token Usuario</button>
    <div id="tokenUsuario" class="result"></div>

    <h2>Generar Token de Dispositivo</h2>
    <input type="text" id="deviceId" placeholder="ID del dispositivo" />
    <input type="text" id="deviceType" placeholder="Tipo de dispositivo" />
    <button onclick="generarTokenDispositivo()">Generar Token Dispositivo</button>
    <div id="tokenDispositivo" class="result"></div>

    <h2>Probar Acceso Protegido</h2>
    <button onclick="probarZeroTrust()">Probar /api/devices</button>
    <div id="respuestaProtegida" class="result"></div>

    <script>
        let tokenUsuario = '';
        let tokenDispositivo = '';

        async function generarTokenUsuario() {
            const res = await fetch('/login', { method: 'POST' });
            const data = await res.json();
            tokenUsuario = data.token;
            document.getElementById('tokenUsuario').textContent = tokenUsuario;
        }

        async function generarTokenDispositivo() {
            const deviceId = document.getElementById('deviceId').value || 'device1';
            const deviceType = document.getElementById('deviceType').value || 'sensor';
            const res = await fetch('/device-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, type: deviceType })
            });
            const data = await res.json();
            tokenDispositivo = data.token;
            document.getElementById('tokenDispositivo').textContent = tokenDispositivo;
        }

        async function probarZeroTrust() {
            if (!tokenUsuario || !tokenDispositivo) {
                document.getElementById('respuestaProtegida').textContent = 'Genera ambos tokens primero.';
                return;
            }
            const res = await fetch('/api/devices', {
                headers: {
                    'User-Authorization': 'Bearer ' + tokenUsuario,
                    'Device-Authorization': 'Bearer ' + tokenDispositivo
                }
            });
            const data = await res.json();
            document.getElementById('respuestaProtegida').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
